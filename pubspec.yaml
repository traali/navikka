name: sakkoja
description: "Navikka - Intelligent Marine Safety Navigator for Finnish Waters."
publish_to: 'none'

version: 1.25.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  archive: ^4.0.7
  battery_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  device_info_plus: ^13.1.0
  dio: ^5.9.2
  dio_smart_retry: ^7.0.1
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_cache_manager: ^3.4.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  go_router: ^17.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  logger: ^2.6.2
  mgrs_dart: ^3.0.0
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  phosphor_flutter: ^2.1.0
  proj4dart: ^3.0.0
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.3.1
  url_launcher: ^6.3.1
  uuid: ^4.5.2
  web: ^1.1.0
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  mocktail: ^1.0.3
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.2.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/navigation_aids/
    - assets/icons/nautical/
    - assets/icons/nautical/official/
    - assets/icons/nautical/iala_a/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

dependency_overrides:
  # Conflict source is Linux-only (dbus via connectivity_plus→nm→dbus), but
  # dependency_overrides are global. These overrides never affect web/iOS/Android.
  # Remove when dbus.dart ships xml 7 support.
  dbus: ^0.7.10
  # Conflict source is Linux-only (geolocator_linux), but overrides are global.
  # Remove when geolocator 15.x ships with updated constraints.
  geolocator_linux: ^0.2.4
  meta: ^1.18.0
