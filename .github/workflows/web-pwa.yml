name: Web PWA companion

on:
  pull_request:
    paths:
      - "apps/web-pwa/**"
      - ".github/workflows/web-pwa.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "web/_redirects"
      - "scripts/architecture_check.dart"
      - "test/core/web_companion_contract_test.dart"
      - "AGENTS.md"
      - ".agent/skills/navikka-underway/**"
  push:
    branches: [main]
    paths:
      - "apps/web-pwa/**"
      - ".github/workflows/web-pwa.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "web/_redirects"
      - "scripts/architecture_check.dart"
      - "test/core/web_companion_contract_test.dart"
      - "AGENTS.md"
      - ".agent/skills/navikka-underway/**"


jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
