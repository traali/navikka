name: 🐛 Bug Report
description: Report a bug to help us improve.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you did and what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Please provide a list of steps or a code snippet to reproduce the bug.
      placeholder: |
        1. Open the app
        2. Zoom in on Lauttasaari
        3. ...
    validations:
      required: true
  - type: input
    id: flutter-version
    attributes:
      label: Flutter Version
      description: Run `flutter --version` and paste it here.
  - type: dropdown
    id: platform
    attributes:
      label: Affected Platform
      options:
        - Android
        - iOS
        - Web
        - Desktop (Windows/macOS/Linux)
    validations:
      required: true
