# Lefthook Git Hooks Configuration for Navikka
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.dart"
      run: dart format --set-exit-if-changed {staged_files}
    analyze:
      run: dart analyze
    companion-test:
      glob: "apps/web-pwa/**"
      run: cd apps/web-pwa && npm test && npm run typecheck
