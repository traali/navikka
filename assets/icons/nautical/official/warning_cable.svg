<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Finnish Waterway Sign: Cable Warning (Square, Red Border) -->
  <rect x="0" y="0" width="200" height="200" fill="white" />
  <rect x="10" y="10" width="180" height="180" stroke="#E30613" stroke-width="20" fill="none" />
  
  <!-- Content: Electric Cable Symbol (Zig-zag arrow going down) -->
  <!-- Vertical zig-zag -->
  <path d="M100,40 L100,70 L70,100 L130,130 L100,160" stroke="black" stroke-width="12" stroke-linejoin="round" fill="none" />
  <!-- Arrowhead at bottom -->
  <path d="M85,150 L100,175 L115,150" fill="black" />
</svg>
