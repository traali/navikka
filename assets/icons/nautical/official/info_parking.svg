<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Finnish Waterway Sign: Parking (Square, Blue Background) -->
  <rect x="0" y="0" width="200" height="200" fill="#0057B8" />
  <rect x="5" y="5" width="190" height="190" stroke="white" stroke-width="5" fill="none" /> 
  
  <!-- Content: 'P' Letter -->
  <path d="M70,40 h50 a35,35 0 0 1 0,70 h-50 v-70 z M70,110 v50 H45 V40 h25" fill="white" stroke="white" stroke-width="15" stroke-linejoin="round" />
  <!-- Correcting simple path for block P -->
  <path d="M60,40 H100 A35,35 0 0 1 100,110 H60 V160 H90" stroke="none" fill="none" /> 
  <!-- Better P shape manually -->
  <path d="M75,160 L75,40 L110,40 C135,40 150,55 150,75 C150,95 135,110 110,110 L95,110 L95,160 L75,160 Z M95,60 L95,90 L110,90 C120,90 125,85 125,75 C125,65 120,60 110,60 L95,60 Z" fill="white" />
</svg>
