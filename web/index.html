<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Navikka - Älykäs merinavigaattori ja meriturvajärjestelmä.">

  <!-- COOP/COEP MUST be set as HTTP response headers by your server/CDN.
       Meta tags are silently ignored for these policies by all browsers.
       See deployment docs for Cloudflare Pages / Firebase Hosting config. -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Navikka">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Navikka</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #050505;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .loading-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    /* Nova Design: Liquid Glassmorphism Loader */
    .loader-ring {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #00D2FF;
      border-right-color: #00D2FF;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .loader-text {
      margin-top: 24px;
      color: #FFFFFF;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 12px;
      opacity: 0.8;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* Background accent for premium feel */
    .bg-accent {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(60px);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent"></div>
  <div class="loading-container">
    <div class="loader-ring">
      <div style="width: 24px; height: 24px; background: #00D2FF; border-radius: 50%; filter: blur(5px); box-shadow: 0 0 15px #00D2FF;"></div>
    </div>
    <div class="loader-text" id="loading-text">Initializing Sea Chart</div>
    <div class="error-text" id="error-text">Initialization is taking longer than expected.</div>
    <button class="reload-button" id="reload-button" onclick="window.location.reload()">Reload Application</button>
  </div>
  <script>
    // Automatically hide loader when Flutter view appears
    const observer = new MutationObserver((mutations) => {
      if (document.querySelector('flutter-view')) {
        document.querySelector('.loading-container').style.display = 'none';
        document.querySelector('.bg-accent').style.display = 'none';
        observer.disconnect();
        if (window.initTimeout) clearTimeout(window.initTimeout);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout: 20 seconds
    window.initTimeout = setTimeout(() => {
      if (!document.querySelector('flutter-view')) {
        document.getElementById('loading-text').style.display = 'none';
        document.getElementById('error-text').style.display = 'block';
        document.getElementById('reload-button').style.display = 'block';
      }
    }, 20000);
  </script>
  <script>
    // Force unregister stale PWA Service Workers to ensure users receive latest build
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
